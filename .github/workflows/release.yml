# Publishing runs here rather than from a laptop, so a release needs no
# interactive npm login and no long-lived token anywhere.
#
# Authentication is npm Trusted Publishing: GitHub mints a short-lived OIDC
# token for this exact repository and workflow, and npm exchanges it for
# publish rights. There is no secret to store, rotate or leak, and the account
# stays on `auth-and-writes` two-factor. It also stamps the published tarball
# with provenance, so the registry page links each version back to the commit
# and the run that built it.
#
# One-time setup on npmjs.com, under the package's Settings > Trusted publisher:
# GitHub Actions, organisation `howells`, repository `lint`, workflow
# `release.yml`. Nothing else is needed and nothing expires.
#
# To release: bump the version, merge to main, then push a matching `vX.Y.Z`
# tag. The tag is the trigger; the job refuses to publish if the tag and
# `package.json` disagree.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # Required for Trusted Publishing. Without it npm gets no OIDC token and
  # falls back to looking for credentials that do not exist here.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or newer. The pinned Node ships
      # 11.12.1, so there is nothing to install. Assert it rather than let a
      # future Node downgrade surface as an unexplained auth failure.
      - name: Check npm can do Trusted Publishing
        run: |
          have="$(npm --version)"
          need=11.5.1
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "npm $have predates Trusted Publishing (need >= $need)" >&2
            exit 1
          fi
          echo "npm $have"

      - run: pnpm install --frozen-lockfile

      # The tag is the only thing a human types, so it is the thing to verify.
      # A tag that disagrees with package.json would publish a version nobody
      # asked for, under a tag that points somewhere else.
      - name: Check the tag matches the version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p 'require("./package.json").version')"
          if [ "$tagged" != "$declared" ]; then
            echo "tag v$tagged does not match package.json $declared" >&2
            exit 1
          fi

      # The same gate that guards a pull request: format check, lint with
      # warnings denied, the test suite, and the peer-dependency check that
      # keeps ESLint out of the graph.
      - run: pnpm prepush

      # `pnpm pack` rather than publishing the directory. npm does not
      # understand pnpm's `catalog:` and `workspace:` specifiers, so publishing
      # a directory in a workspace that uses them ships them unexpanded and
      # produces a tarball nobody can install. That bug reached the registry
      # from a sibling repo once already. This package has no such specifier
      # today, and the packed file list is identical either way, so the cost is
      # nothing and the shape stays correct if one is ever added.
      - name: Pack
        run: pnpm pack --pack-destination /tmp

      # Access comes from `publishConfig` in package.json rather than a flag
      # here, so one declaration governs every publish of this package.
      #
      # `--provenance` is required, despite npm documenting Trusted Publishing
      # as attaching provenance by itself. Measured as a controlled pair:
      # `@instruments/colorscope@9.1.0` published from a trusted-publishing
      # workflow without the flag and its attestations endpoint answers
      # `{"error":"Not found"}` long after the release became installable;
      # `@howells/lint@3.2.5` and `@3.3.0` published the same way with the flag
      # and each carries two attestations, the npm publish one and SLSA
      # provenance. Same mechanism, same account, different flag, different
      # outcome. Dropping it loses provenance silently.
      - name: Publish
        run: npm publish /tmp/howells-lint-*.tgz --provenance
