# Publishing runs here rather than from a laptop, so a release needs no
# interactive npm login and no long-lived token anywhere.
#
# Authentication is npm Trusted Publishing: GitHub mints a short-lived OIDC
# token for this exact repository and workflow, and npm exchanges it for
# publish rights. There is no secret to store, rotate or leak, and the account
# stays on `auth-and-writes` two-factor. It also stamps the published tarball
# with provenance, so the registry page links each version back to the commit
# and the run that built it.
#
# One-time setup on npmjs.com, under the package's Settings > Trusted publisher:
# GitHub Actions, organisation `howells`, repository `lint`, workflow
# `release.yml`. Nothing else is needed and nothing expires.
#
# To release: bump the version and merge to main, then publish a GitHub release
# `vX.Y.Z` (see docs/releasing.md). Publishing the release is the trigger; the
# job refuses to publish if the tag and `package.json` disagree, or if lint or
# a test fails.
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Lets this job obtain the npm Trusted Publishing OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches the version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p 'require("./package.json").version')"
          if [ "$tagged" != "$declared" ]; then
            echo "tag v$tagged does not match package.json $declared" >&2
            exit 1
          fi

      # Trusted Publishing requires npm >=11.5.1. The pinned Node includes it.
      - name: Check npm can do Trusted Publishing
        run: |
          have="$(npm --version)"
          need=11.5.1
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "npm $have predates Trusted Publishing (need >= $need)" >&2
            exit 1
          fi
          echo "npm $have"

      - run: pnpm lint
      - run: pnpm test

      # Pack with pnpm, which expands catalog:/workspace: specifiers, and
      # publish that tarball rather than the directory.
      - name: Pack
        run: pnpm pack --pack-destination "$RUNNER_TEMP/packed-package"

      # Access comes from publishConfig. Keep the explicit provenance flag:
      # Trusted Publishing without it has previously omitted SLSA attestations.
      - name: Publish
        run: npm publish "$RUNNER_TEMP"/packed-package/*.tgz --provenance
